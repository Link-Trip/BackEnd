services:
  mysql:
    image: mysql:8.4
    container_name: linktrip-mysql
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - MYSQL_DATABASE=linktrip
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --default-time-zone=+09:00
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - linktrip-network

volumes:
  mysql-data:

networks:
  linktrip-network:
    name: linktrip-network
    driver: bridge
