server {
    listen 80;
    server_name linktrip.cloud;

    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name linktrip.cloud;

    ssl_certificate /etc/letsencrypt/live/linktrip.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linktrip.cloud/privkey.pem;

    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    location / {
        proxy_pass http://linktrip-app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
