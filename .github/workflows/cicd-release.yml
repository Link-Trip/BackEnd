name: CI/CD

on:
  release:
    types:
      - published

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 909176971481.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: linktrip

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository 접근
        uses: actions/checkout@v4

      - name: JDK 21 셋팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gradle 의존성 캐싱
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: JAR 빌드
        run: ./gradlew :linktrip-bootstrap:bootJar

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker 이미지 빌드 및 푸시
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest .
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest

      - name: docker-compose.prod.yml EC2에 전송
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ec2-user
          key: ${{ secrets.SERVER_KEY }}
          source: "docker/docker-compose.prod.yml"
          target: "~/linktrip/"
          strip_components: 1

      - name: EC2 배포
        uses: appleboy/ssh-action@master
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          DISCORD_WEBHOOK_ERROR_URL: ${{ secrets.DISCORD_WEBHOOK_ERROR_URL }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ec2-user
          key: ${{ secrets.SERVER_KEY }}
          envs: JWT_SECRET_KEY,DISCORD_WEBHOOK_ERROR_URL,DISCORD_MENTION_USER_ID,GCP_PROJECT_ID,GCP_CREDENTIALS_JSON,YOUTUBE_API_KEY
          script: |
            set -e

            DEPLOY_DIR=~/linktrip

            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 909176971481.dkr.ecr.ap-northeast-2.amazonaws.com

            # 배포 디렉토리 생성
            mkdir -p $DEPLOY_DIR

            # .env 파일 생성
            cat > $DEPLOY_DIR/.env << EOF
            JWT_SECRET_KEY=${JWT_SECRET_KEY}
            DISCORD_WEBHOOK_ERROR_URL=${DISCORD_WEBHOOK_ERROR_URL}
            DISCORD_MENTION_USER_ID=${DISCORD_MENTION_USER_ID}
            GCP_PROJECT_ID=${GCP_PROJECT_ID}
            YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
            EOF
            chmod 600 $DEPLOY_DIR/.env

            # GCP credentials JSON 파일 생성 (base64 디코딩)
            echo "${GCP_CREDENTIALS_JSON}" | base64 -d > $DEPLOY_DIR/gcp-credentials.json
            chmod 600 $DEPLOY_DIR/gcp-credentials.json

            # docker-compose 배포
            cd $DEPLOY_DIR
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

            echo ">>> 배포 완료"
            docker compose -f docker-compose.prod.yml ps

      - name: 디스코드 배포 알림
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_RELEASE_URL }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          payload=$(jq -n \
            --arg content "@everyone\n🚀 링크트립 백엔드 배포 완료" \
            --arg tag "$RELEASE_TAG" \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            '{
              content: $content,
              allowed_mentions: { parse: ["everyone"] },
              embeds: [
                {
                  title: ($name + " (" + $tag + ")"),
                  description: $body,
                  color: 5814783
                }
              ]
            }')
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$DISCORD_WEBHOOK_URL"
