spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - classpath:application-actuator.yml
      - classpath:application-http.yml

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080
  shutdown: graceful

jwt:
  secret-key: ${JWT_SECRET_KEY:linktrip-dev-secret-key-must-be-at-least-32-bytes-long!!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
