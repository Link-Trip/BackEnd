spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - classpath:application-actuator.yml
      - classpath:application-http.yml

  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

server:
  port: 8080
  shutdown: graceful

jwt:
  secret-key: ${JWT_SECRET_KEY:Y8s3KfTx9QzVnW2pRmHdA7uBcEjL4gXo6iNtZw5yCrDqFvMb0hJlPkSaUeG1xOI}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

notification:
  discord:
    webhook-url-error: "${DISCORD_WEBHOOK_ERROR_URL}"
    mention-user-id: "${DISCORD_MENTION_USER_ID}"

gcp:
  project-id: ${GCP_PROJECT_ID:}
  credentials-path: ${GCP_CREDENTIALS_PATH:}
  vertex-ai:
    location: ${GCP_VERTEX_AI_LOCATION:us-central1}

youtube:
  api-key: ${YOUTUBE_API_KEY:}
