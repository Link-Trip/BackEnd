spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://linktrip-mysql:3306/linktrip?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

youtube:
  proxy:
    username: ${YOUTUBE_PROXY_USERNAME}
    password: ${YOUTUBE_PROXY_PASSWORD}
