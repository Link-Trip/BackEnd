[versions]
springBoot = "3.3.0"
springDependencyManagement = "1.1.5"
kotlinPlugin = "2.0.0"
jjwt = "0.12.6"
querydsl = "5.1.0"
ktLintPlugin = "12.1.1"
gradleBuildScanPlugin = "3.18.1"
javaVersion = "21"
fixture-monkey = "1.1.11"
bucket4j = "8.17.0"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlinPlugin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlinPlugin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlinPlugin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlinPlugin" }
kotlin-lint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktLintPlugin" }
gradle-develocity = { id = "com.gradle.develocity", version.ref = "gradleBuildScanPlugin" }

[libraries]
# Kotlin
kotlin-jackson = { group = "com.fasterxml.jackson.module", name = "jackson-module-kotlin" }
kotlin-reflect = { group = "org.jetbrains.kotlin", name = "kotlin-reflect" }
kotlin-logging = { group = "io.github.microutils", name = "kotlin-logging-jvm", version = "3.0.5" }

# Spring
spring-web = { group = "org.springframework", name = "spring-web" }
spring-transaction = { group = "org.springframework", name = "spring-tx" }

spring-boot-starter-autoconfigure = { group = "org.springframework.boot", name = "spring-boot-autoconfigure" }
spring-boot-starter-web = { group = "org.springframework.boot", name = "spring-boot-starter-web" }
spring-boot-starter-aop = { group = "org.springframework.boot", name = "spring-boot-starter-aop" }
spring-boot-starter-actuator = { group = "org.springframework.boot", name = "spring-boot-starter-actuator" }
spring-boot-starter-validation = { group = "org.springframework.boot", name = "spring-boot-starter-validation" }
spring-boot-starter-cache = { group = "org.springframework.boot", name = "spring-boot-starter-cache" }
spring-boot-starter-jpa = { group = "org.springframework.boot", name = "spring-boot-starter-data-jpa" }
spring-boot-starter-redis = { group = "org.springframework.boot", name = "spring-boot-starter-data-redis" }
spring-boot-docs = { group = "org.springdoc", name = "springdoc-openapi-starter-webmvc-ui", version = "2.5.0" }

# QueryDSL
querydsl-jpa = { group = "com.querydsl", name = "querydsl-jpa", version.ref = "querydsl" }
querydsl-apt = { group = "com.querydsl", name = "querydsl-apt", version.ref = "querydsl" }

# MySQL
mysql = { group = "com.mysql", name = "mysql-connector-j" }

# JWT
jjwt-api = { group = "io.jsonwebtoken", name = "jjwt-api", version.ref = "jjwt" }
jjwt-impl = { group = "io.jsonwebtoken", name = "jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { group = "io.jsonwebtoken", name = "jjwt-jackson", version.ref = "jjwt" }

# Spring Batch
spring-boot-starter-batch = { group = "org.springframework.boot", name = "spring-boot-starter-batch" }

# Cache
caffeine = { group = "com.github.ben-manes.caffeine", name = "caffeine", version = "3.1.8" }

# Rate Limit
bucket4j-core = { group = "com.bucket4j", name = "bucket4j_jdk17-core", version.ref = "bucket4j" }

# Coroutines
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version = "1.10.2" }

# Google Cloud
google-genai = { group = "com.google.genai", name = "google-genai", version = "0.7.0" }

# YouTube Transcript
youtube-transcript-api = { group = "io.github.thoroldvix", name = "youtube-transcript-api", version = "0.4.0" }

# Storage (AWS S3)
aws-sdk-s3 = { group = "com.amazonaws", name = "aws-java-sdk-s3", version = "1.11.238" }

# Test
spring-boot-annotation-processor = { group = "org.springframework.boot", name = "spring-boot-configuration-processor" }
spring-boot-starter-test = { group = "org.springframework.boot", name = "spring-boot-starter-test" }
kotlin-junit5 = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit5" }
junit = { group = "org.junit.platform", name = "junit-platform-launcher" }
mockito-kotlin = { group = "org.mockito.kotlin", name = "mockito-kotlin", version = "5.4.0" }
fixture-monkey-starter-kotlin = { group = "com.navercorp.fixturemonkey", name = "fixture-monkey-starter-kotlin", version.ref = "fixture-monkey" }

[bundles]
# 공통 (convention에서 사용)
spring-common = ["spring-boot-starter-autoconfigure"]
kotlin-spring = ["kotlin-reflect", "kotlin-jackson", "kotlin-logging"]
test-implementation = ["spring-boot-starter-test", "kotlin-junit5", "mockito-kotlin", "fixture-monkey-starter-kotlin"]
test-runtime = ["junit"]

# 모듈별
bootstrap = ["spring-boot-starter-web", "spring-boot-starter-actuator"]
domain-application = ["spring-boot-docs", "spring-transaction", "kotlinx-coroutines-core"]
adaptor-input-http = ["spring-boot-starter-web", "spring-boot-starter-aop", "spring-boot-docs", "spring-boot-starter-validation", "jjwt-api", "jjwt-impl", "jjwt-jackson"]
adaptor-persistence-mysql = ["spring-boot-starter-jpa", "mysql"]
adaptor-cache-redis = ["spring-boot-starter-cache", "spring-boot-starter-redis"]
adaptor-cache-caffeine = ["spring-boot-starter-cache", "caffeine", "bucket4j-core"]
adaptor-storage-aws = ["spring-web", "aws-sdk-s3"]
adaptor-output-http = ["spring-web", "google-genai", "youtube-transcript-api"]
adaptor-input-batch = ["spring-boot-starter-batch"]
